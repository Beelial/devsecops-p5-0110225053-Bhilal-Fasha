name: DevSecOps Pipeline

# Kapan workflow berjalan: saat push ke main dan saat pull request ke main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------- Job 1: build ----------
  build:
    name: Build dan Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4

      - name: Siapkan Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan unit test
        run: pytest -v

  # ---------- Job 2: sast-scan ----------
  sast-scan:
    name: SAST Scan dan Quality Gate
    runs-on: ubuntu-latest
    needs: build # hanya berjalan jika job build berhasil
    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4

      - name: Siapkan Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Pindai kode dengan Bandit (hasil tampil di log dan disimpan)
        run: bandit -r src --exit-zero | tee bandit-report.txt

      - name: Simpan laporan Bandit
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt

      # Quality Gate: gagal jika ada temuan severity MEDIUM atau HIGH
      # (-ll = laporkan hanya severity MEDIUM ke atas)
      - name: Quality Gate (gagal jika ada temuan MEDIUM atau HIGH)
        run: bandit -r src -ll
